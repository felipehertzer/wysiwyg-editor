name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 from 2026-10-19) and actions to commit
# SHAs, which Dependabot keeps current.
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Validate package manifests
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of ["package.json", "bower.json", "composer.json"]) {
              JSON.parse(fs.readFileSync(file, "utf8"));
            }
          '
          composer validate --strict --no-check-publish
      - name: Validate JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Validate PHP examples
        run: |
          while IFS= read -r -d '' file; do
            php --syntax-check "$file"
          done < <(find html -type f -name '*.php' -print0)
      - name: Verify custom patches remain applied
        run: |
          ./apply-fixes.sh
          git diff --exit-code
